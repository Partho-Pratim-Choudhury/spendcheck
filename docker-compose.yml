services:
  postgres:
    image: postgres:16-alpine
    container_name: spendcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spendcheck}
      POSTGRES_USER: ${DB_USER:-spendcheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spendcheck} -d ${DB_NAME:-spendcheck}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
