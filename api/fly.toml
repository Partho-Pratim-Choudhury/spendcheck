# Fly.io config for the SpendCheck API. Run `fly launch --no-deploy` from api/ to create the
# app and a Postgres database, then set secrets and `fly deploy` (see ../DEPLOY.md).
app = "spendcheck-api"            # change to your own unique app name
primary_region = "sin"           # Singapore — closest Fly region to India

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8080"
  SPRING_AI_OPENAI_BASE_URL = "https://api.groq.com/openai"
  LLM_MODEL = "openai/gpt-oss-20b"
  STT_MODEL = "whisper-large-v3-turbo"
  # Secrets (never here): set with `fly secrets set` —
  #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
  #   OPENAI_API_KEY, JWT_SECRET, APP_USER_EMAIL, APP_USER_PASSWORD

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # scale to zero when idle (free-tier friendly)
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [[http_service.checks.http]]
      path = "/actuator/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "40s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
