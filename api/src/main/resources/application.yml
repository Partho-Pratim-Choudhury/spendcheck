spring:
  application:
    name: spendcheck-api
  config:
    # Root .env holds KEY=VALUE secrets; the app is normally run from api/.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:spendcheck}
    username: ${DB_USER:spendcheck}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    openai:
      # The app must boot without a real key; /inputs/* answer 503 until one is set.
      api-key: ${OPENAI_API_KEY:not-set}
      # Empty = OpenAI. Set an OpenAI-compatible base (e.g. Groq https://api.groq.com/openai) to use another provider.
      base-url: ${SPRING_AI_OPENAI_BASE_URL:}
    # AiConfig builds its own OpenAI clients; don't let the starter auto-configure (unused) model beans.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
  servlet:
    multipart:
      # Voice notes are capped at 2 MB (InputController re-checks); a bigger request is rejected as 400.
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8077}
  tomcat:
    # Read (and discard) oversized uploads so the client gets the 400 instead of a reset connection.
    max-swallow-size: 10MB
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

spendcheck:
  tz: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 7d
  seed-user:
    email: ${APP_USER_EMAIL:}
    password: ${APP_USER_PASSWORD:}
    name: ${APP_USER_NAME:Partho}
    salary-day: ${APP_SALARY_DAY:7}
  llm:
    model: ${LLM_MODEL:gpt-5.4-mini}
    confidence-threshold: ${LLM_CONFIDENCE_THRESHOLD:0.7}
    reasoning-effort: ${LLM_REASONING_EFFORT:low}
    timeout: 20s
  stt:
    model: ${STT_MODEL:gpt-4o-mini-transcribe}
    timeout: 20s
  raw-inputs:
    retention-days: ${RAW_INPUT_RETENTION_DAYS:90}
