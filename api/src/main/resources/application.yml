spring:
  application:
    name: spendcheck-api
  config:
    # Root .env holds KEY=VALUE secrets; the app is normally run from api/.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:spendcheck}
    username: ${DB_USER:spendcheck}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    openai:
      # Spring AI is wired but unused in week 1; the app must boot without a real key.
      api-key: ${OPENAI_API_KEY:not-set}

server:
  port: ${SERVER_PORT:8077}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

spendcheck:
  tz: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 7d
  seed-user:
    email: ${APP_USER_EMAIL:}
    password: ${APP_USER_PASSWORD:}
    name: ${APP_USER_NAME:Partho}
    salary-day: ${APP_SALARY_DAY:7}
  llm:
    model: ${LLM_MODEL:}
  stt:
    model: ${STT_MODEL:}
